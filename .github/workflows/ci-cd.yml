# CI/CD for the Vang Clan (Xeem Vaj) Association API.
#
# Deployment is handled by Render itself, not by this workflow — there is no
# deploy job and no secrets to manage. Render watches `main` and, with
# Auto-Deploy set to "After CI Checks Pass", waits for the checks below to go
# green before it builds. A red run therefore blocks the deploy.
#
# That setting lives in the Render dashboard only (Settings → Build & Deploy
# → Auto-Deploy); it has no render.yaml equivalent. See DEPLOYMENT.md.
#
# CI does not use a database. Migrations are applied by Render's build
# command against the real Supabase database at deploy time.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are pointless. Runs on main are never cancelled: a
  # cancelled check is not a passed check, so it would stall the deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      # `npm ci` runs the postinstall `prisma generate`, which needs no
      # database connection.
      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Assembles the real compiled Express app and serves one request.
      # createApp() never touches the database, so this needs no Postgres —
      # it catches broken imports, bad route wiring and missing env vars,
      # which a typecheck alone cannot see.
      - name: Smoke test the built app
        env:
          NODE_ENV: production
          # Never connected to; env.ts only requires the value to be present.
          DATABASE_URL: postgresql://unused
          JWT_ACCESS_SECRET: ci-access-secret-not-a-real-secret
          JWT_REFRESH_SECRET: ci-refresh-secret-not-a-real-secret
          CORS_ORIGINS: https://hmong-clan.vchoua05.workers.dev/
        run: |
          node -e "
            const { createApp } = require('./dist/app');
            const server = createApp().listen(4000, async () => {
              try {
                const res = await fetch('http://localhost:4000/api/health');
                const body = await res.text();
                console.log('GET /api/health ->', res.status, body);
                if (!res.ok) throw new Error('health check returned ' + res.status);
                server.close();
              } catch (err) {
                console.error(err);
                process.exit(1);
              }
            });
          "
