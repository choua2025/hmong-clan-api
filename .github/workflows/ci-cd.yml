# CI/CD for the Vang Clan (Xeem Vaj) Association API.
#
# Deployment is handled by Render itself, not by this workflow — there is no
# deploy job and no secrets to manage. Render watches `main` and, with
# Auto-Deploy set to "After CI Checks Pass", waits for the checks below to go
# green before it builds. A red run therefore blocks the deploy.
#
# That setting lives in the Render dashboard only (Settings → Build & Deploy
# → Auto-Deploy); it has no render.yaml equivalent. See DEPLOYMENT.md.
#
# CI does not use a database. Migrations are applied by Render's build
# command against the real Supabase database at deploy time.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are pointless. Runs on main are never cancelled: a
  # cancelled check is not a passed check, so it would stall the deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Verify
    runs-on: ubuntu-latest

    # prisma.config.ts resolves env('DATABASE_URL') when the config loads, so
    # EVERY prisma command needs it set — including the `prisma generate` that
    # npm runs as a postinstall hook during `npm ci`. Locally this is supplied
    # by .env, which is gitignored and therefore absent here. CI never opens a
    # connection, so a placeholder is enough.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      # `npm ci` runs the postinstall `prisma generate`, which needs no
      # database connection.
      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Assembles the real compiled Express app and serves one request.
      # createApp() never touches the database, so this needs no Postgres —
      # it catches broken imports, bad route wiring and missing env vars,
      # which a typecheck alone cannot see.
      - name: Smoke test the built app
        env:
          NODE_ENV: production
          # DATABASE_URL comes from the job-level env above.
          JWT_ACCESS_SECRET: ci-access-secret-not-a-real-secret
          JWT_REFRESH_SECRET: ci-refresh-secret-not-a-real-secret
          CORS_ORIGINS: https://hmong-clan.vchoua05.workers.dev/
        run: |
          node -e "
            const { createApp } = require('./dist/app');
            const server = createApp().listen(4000, async () => {
              try {
                const res = await fetch('http://localhost:4000/api/health');
                const body = await res.text();
                console.log('GET /api/health ->', res.status, body);
                if (!res.ok) throw new Error('health check returned ' + res.status);
                server.close();
              } catch (err) {
                console.error(err);
                process.exit(1);
              }
            });
          "

  # Render builds this same Dockerfile to produce the production image, so a
  # broken Dockerfile is a broken deploy. Building it here surfaces that on the
  # PR instead of halfway through a Render build.
  docker:
    name: Docker image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the prod image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          # Loaded into the local daemon rather than pushed — Render builds
          # its own image from source; this job only proves it can be built.
          load: true
          push: false
          tags: vang-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Guards the two things that break silently inside the image and only
      # surface during a Render deploy.
      - name: Verify the image can run migrations
        run: |
          # The prisma CLI must exist (it arrives as a peer dependency of
          # @prisma/client) or Render's preDeployCommand cannot run.
          docker run --rm -e DATABASE_URL="postgresql://x:x@localhost:5432/x" \
            vang-api:ci npx prisma --version

          # The Prisma client must load — proves `prisma generate` produced a
          # LINUX engine rather than the host's.
          docker run --rm vang-api:ci \
            node -e "require('@prisma/client'); console.log('prisma client loads OK')"

      - name: Verify the image runs as a non-root user
        run: |
          user=$(docker run --rm vang-api:ci whoami)
          echo "container user: $user"
          [ "$user" = "node" ] || { echo "expected to run as 'node'" >&2; exit 1; }
