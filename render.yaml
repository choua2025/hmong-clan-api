# Render blueprint for the Vang Clan (Xeem Vaj) Association API.
#
# The database is NOT declared here — it lives in Supabase. Set DATABASE_URL
# in the Render dashboard to the Supabase *session pooler* string (port 5432,
# user postgres.<project-ref>). The direct db.<ref>.supabase.co host is
# IPv6-only and Render cannot reach it.
services:
  - type: web
    name: hmong-clan-api
    # Render builds the repo's Dockerfile, so what runs in production is the
    # same image you get from `docker build --target prod .` locally.
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # There is no blueprint field for selecting a build stage, so Render
    # builds the LAST stage in the Dockerfile. `prod` is deliberately last —
    # do not add a stage after it or Render will ship that instead.
    plan: free
    # Seoul-hosted Supabase (ap-northeast-2); Singapore is Render's nearest region.
    region: singapore
    branch: main
    # autoDeploy is deliberately NOT set here. Gating deploys on CI is the
    # "After CI Checks Pass" option, which exists only in the dashboard
    # (Settings → Build & Deploy → Auto-Deploy) and has no blueprint field —
    # pinning autoDeploy here could override that choice with a plain
    # deploy-on-every-commit. See DEPLOYMENT.md.
    # Migrations no longer ride along in the build: a Docker build has no
    # database access. preDeployCommand runs inside the freshly built image,
    # after the build and before any traffic is shifted, so a failed migration
    # aborts the deploy and leaves the running instance untouched.
    preDeployCommand: npx prisma migrate deploy
    # No buildCommand/startCommand: the Dockerfile owns both. The container
    # starts via its CMD (node dist/server.js).
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: "12"
      - key: DEFAULT_CURRENCY
        value: LAK
      # Cloudinary credentials are secrets — set them in the dashboard.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Not a secret: the folder every asset from this app is confined to.
      - key: CLOUDINARY_FOLDER
        value: hmong_clan_image
